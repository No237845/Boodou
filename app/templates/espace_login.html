{% extends "base_espace.html" %}
{% block page_title %}{{ t('actor_login') }}{% endblock %}
{% block main_class %}{% endblock %}
{% block content %}
<h1>{{ t('actor_login') }}</h1>
<p class="muted">{{ t('actor_login_intro') }}</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/espace/login" autocomplete="off">
  <label for="username">{{ t('actor_username') }}</label>
  <input id="username" name="username" type="text" required autofocus autocapitalize="none">

  <label for="password">{{ t('actor_password') }}</label>
  <input id="password" name="password" type="password" required>

  <button type="submit" class="btn big primary">{{ t('actor_login_button') }}</button>
</form>
{% endblock %}
