{% extends "base_admin.html" %}
{% block page_title %}Connexion{% endblock %}
{% block content %}
<h1>Administration</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/admin/login" autocomplete="off">
  <label for="admin_key">Clé admin</label>
  <input id="admin_key" name="admin_key" type="password" required autofocus>
  <button type="submit" class="btn big primary">Se connecter</button>
</form>
<p class="hint">Vous êtes relais, point focal, agent de l'action sociale ou gestionnaire de cas ?
<a href="/espace">Connectez-vous à l'espace acteurs.</a></p>
{% endblock %}
