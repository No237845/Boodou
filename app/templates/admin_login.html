<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace partenaire — Boodou</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Boodou</a>
  <span class="muted">Espace partenaire</span>
</header>

<main>
<h1>Connexion</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/admin/login" autocomplete="off">
  <label for="admin_key">Clé admin</label>
  <input id="admin_key" name="admin_key" type="password" required autofocus>

  <label for="private_key">Clé privée de déchiffrement (facultatif)</label>
  <textarea id="private_key" name="private_key" rows="2" placeholder="REPORT_PRIVATE_KEY…"></textarea>
  <p class="hint">🔒 Sans clé privée, vous verrez les incidents (type, région, date) mais pas les descriptions.
  La clé est gardée en mémoire le temps de la session (1 h), jamais enregistrée.</p>

  <button type="submit" class="btn big primary">Se connecter</button>
</form>
</main>
</body>
</html>
